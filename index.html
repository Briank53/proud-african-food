<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proud African Food</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:green;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button{
background:green;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#006400;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>🥑 Proud African Food</h1>
<p>Johannesburg, South Africa</p>
</header>

<div class="container">

<div class="card">
<img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=600" alt="">
<h2>Fried Chicken</h2>
<h3>R95</h3>
<button onclick="orderFood('Fried Chicken','R95')">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=600" alt="">
<h2>Pap & Beef Stew</h2>
<h3>R85</h3>
<button onclick="orderFood('Pap & Beef Stew','R85')">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600" alt="">
<h2>Grilled Meat & Chips</h2>
<h3>R120</h3>
<button onclick="orderFood('Grilled Meat & Chips','R120')">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600" alt="">
<h2>Jollof Rice</h2>
<h3>R80</h3>
<button onclick="orderFood('Jollof Rice','R80')">Order Now</button>
</div>

</div>

<footer>
Proud African Food © 2026
</footer>

<script>
function orderFood(food,price){
let phone="27686876128";
let message=`Hello Proud African Food!%0A%0AI would like to order:%0A${food}%0APrice: ${price}`;
window.open(`https://wa.me/${phone}?text=${message}`,"_blank");
}
</script>

</body>
</html>

<h1>Checkout</h1>

<label>Name</label>
<input type="text">

<label>Phone</label>
<input type="text">

<label>Address</label>
<input type="text">

<button>
Pay Now
  </button>
